[package]
name = "skyfs"
version = "0.1.0"
description = "skyfs daemon and CLI: create, mount (FUSE on Linux, NFS on macOS), fsck"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "skyfs"
path = "src/main.rs"

[dependencies]
skyfs-format.workspace = true
async-trait.workspace = true
nessie-nfsserve = "0.4.4"
parking_lot.workspace = true
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
skyfs-meta.workspace = true
skyfs-store.workspace = true
skyfs-volume.workspace = true
clap.workspace = true
libc.workspace = true
rand.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
object_store.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18.0"

[lints]
workspace = true
