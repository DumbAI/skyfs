// skyfs snapshot manifest, format version 1.
//
// A snapshot is the filesystem state after applying the log through segment
// `restored_seq`, stored in blob storage. Its manifest is the restore pointer:
// it says how far into the log blob storage has been restored. See
// docs/design.md §7 and docs/wal-format.md.
//
// Key: snapshots/<gen:020>.manifest, gen dense from 0, written once with
// If-None-Match: *. The manifest is the commit point of a restore pass, so it
// is written last: after the packs and the metadata file it references.

syntax = "proto3";

package skyfs.snapshot.v1;

message SnapshotManifest {
  bytes volume_id = 1;
  uint64 gen = 2;                 // equals the gen in the key
  uint64 parent_gen = 3;          // snapshot this one was built from (gen - 1, or 0 for gen 0)

  // The restore pointer. The state equals apply(parent, segments
  // (parent.restored_seq, restored_seq]).
  uint64 restored_seq = 4;
  uint64 restored_op_id = 5;      // last op_id applied
  bytes restored_digest = 6;      // BLAKE3 of segment restored_seq's record region:
                                  // ties the snapshot to exactly one log history
  uint64 restored_epoch = 7;      // epoch of segment restored_seq

  // The metadata file: zstd-compressed SQLite with inodes, dirents, xattrs
  // and extents. Extents point only at blobs/ and packs/, never at segments,
  // so segments up to restored_seq are not needed to read this state.
  string meta_key = 8;            // snapshots/<gen:020>.meta.zst
  uint64 meta_len = 9;
  bytes meta_blake3 = 10;
  uint32 meta_schema_version = 11;

  uint64 inode_count = 12;
  uint64 data_bytes = 13;         // logical bytes referenced
  int64 created_ns = 14;
  bytes restorer_id = 15;         // which mount or job produced it
}
