name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Linux is the production platform; macOS builds the NFS transport and
  # the macOS-only code paths (local sync).
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # End-to-end through the kernel: create, mount, every POSIX operation the
  # design lists, remount elsewhere, SIGKILL and same-disk recovery, fsck.
  fuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3 attr
      - run: cargo build -p skyfs
      - run: sudo env PATH="$PWD/target/debug:$PATH" scripts/fuse-smoke.sh

  # The NFS transport through each kernel's own NFS client: the same story
  # as the FUSE smoke test. macOS runs it as the runner's user (no root,
  # nothing installed); Linux needs root and nfs-common.
  nfs:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nfs-common
      - run: cargo build -p skyfs
      - if: runner.os == 'Linux'
        run: sudo env PATH="$PWD/target/debug:$PATH" scripts/nfs-smoke.sh
      - if: runner.os == 'macOS'
        run: env PATH="$PWD/target/debug:$PATH" scripts/nfs-smoke.sh

  # POSIX conformance (design §9): the full pjdfstest suite on a skyfs mount.
  pjdfstest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3 autoconf automake gcc make
      - run: cargo build -p skyfs
      - run: sudo env PATH="$PWD/target/debug:$PATH" scripts/pjdfstest.sh

  # The generic xfstests `quick` group through mount(8) and
  # scripts/mount.fuse.skyfs; exclusions are justified in
  # scripts/xfstests.exclude.
  xfstests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The run writes many GiB (bucket, caches, results on the root disk);
      # a hosted runner has about 14 GiB free, and a full disk kills the
      # runner without a log. Drop preinstalled SDKs this job never uses.
      # Inline rather than a third-party action: it runs as root.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /opt/microsoft
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 attr acl xfslibs-dev uuid-dev libtool-bin e2fsprogs \
            automake gcc make libacl1-dev libaio-dev xfsprogs libgdbm-dev gawk fio uuid-runtime \
            python3 sqlite3 libcap2-bin bc psmisc libattr1-dev liburing-dev libinih-dev quota
      # xfstests' expected outputs are GNU coreutils' messages; Ubuntu 26.04
      # defaults to the Rust coreutils (uutils), whose wording differs
      # ("(os error 1)") and whose `touch -d` rejects dates past 2038.
      - name: GNU coreutils
        run: |
          if apt-cache show coreutils-from-gnu >/dev/null 2>&1; then
            sudo apt-get install -y coreutils-from-gnu coreutils-from-uutils- --allow-remove-essential
          fi
          ls --version | head -1
      - run: cargo build --release -p skyfs
      - run: sudo env PATH="$PWD/target/release:$PATH" scripts/xfstests.sh -g quick
